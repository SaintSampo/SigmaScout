# SigmaScout Worker — the live-update Cron Worker (D-17/D-19). Applied with
# `wrangler deploy` / `wrangler dev`. Every binding below is a NAME/ID, never
# a secret — the TBA key is set once with `wrangler secret put TBA_API_KEY`
# (plan 04-07) and is NEVER assigned a value in this file, because this file
# is tracked in git.
name = "sigmascout-worker"

# The real scheduled() orchestration entrypoint (plan 04-06) — reads what is
# live, polls TBA, folds the shared prediction state, and rewrites only the
# artifacts that moved (D-16).
main = "src/scheduled.ts"

compatibility_date = "2026-08-22"
# [Rule 2 fix, plan 04-05 Task 2] Added when `stateStore.ts`'s import of
# `deserializeState` from `packages/harness/stateSnapshot.ts` also pulled in
# that file's Node-only seed emitter (`emitSeedSql`, which imports
# `node:fs`/`node:path` at module top level; ESM imports are file-scoped, so
# the Worker bundle graph carried them even though it never calls it).
# Quick task 260915-4p9 moved that emitter to `packages/harness/seedSql.ts`,
# and `stateSnapshot.ts` no longer imports Node, so that reason no longer
# applies. The flag stays because removing it has not been verified with a
# real bundle and tick.
compatibility_flags = ["nodejs_compat"]

# D-20 (plan 04-07): the real TBA base URL by default, tracked here so the
# override point is visible in the tracked config rather than an undocumented
# back door (T-04-47). The replay rig substitutes a fixture-serving Worker's
# URL for the duration of one measurement run via a DEPLOY-TIME flag —
# `wrangler deploy --var TBA_BASE_URL:<fixture-worker-url>` — never by
# editing this file. See docs/worker-operations.md's "Replay rig" section.
[vars]
TBA_BASE_URL = "https://www.thebluealliance.com/api/v3"

# Every published algorithm folds LIVE, per tick, in PUBLISHED_ALGORITHM_IDS
# display order (quick task 260923-3w8, Jacob's decision 2026-09-23 on
# 260923-1tu-FINDINGS.md item C6). The tier was `spr` alone from 260822-wqt
# until then, held first by the free plan's 50-subrequest cap and then by its
# 10 ms CPU cap; Workers Paid (2026-09-22) retired both, and opr 6.0.0 / epa
# 13.0.0 paid for the published-numbers consequence — those two now advance
# match by match instead of only at the manual re-baseline (D-12). Order here
# is for the reader: `parseLiveAlgorithmIds` hands this list to
# `buildAlgorithmModules`, which filters through a Set, and fold order comes
# from the algorithms manifest. `apps/worker/test/liveAlgorithmTier.test.ts`
# pins this value by EQUALITY, so narrowing or widening it fails there rather
# than silently going untested; any change needs the version bump and republish
# that moving published numbers requires. See docs/worker-operations.md's
# live-folding-tier section. The id was renamed twice (`vpr` by D-04/D-05 in
# plan 07-16, then `spr` for the Sigma Power Rating cutover in 260912-ivg,
# live 2026-09-12), recorded so an operator who remembers an old name knows it
# was retired rather than mistyped.
LIVE_ALGORITHM_IDS = "opr,epa,spr"

# D-17: fires every minute, YEAR-ROUND — never a season-scoped cron
# expression. An offseason event runs in the fall and championship dates
# move, so a hardcoded season calendar is one more thing that silently goes
# stale. A tick with nothing live early-exits after a single manifest read
# (Pattern 2), so ~1,440 near-zero invocations/day is negligible against the
# Workers free plan's 100,000/day allowance.
[triggers]
crons = ["* * * * *"]

# D-27: the tick emits one structured JSON line per invocation
# (src/scheduled.ts's default export). Without this block those lines are
# visible to a live `wrangler tail` but are NOT retained, so an operator
# asking "was the cron firing an hour ago, while I was asleep?" — the
# question docs/worker-operations.md's troubleshooting table opens with —
# has no way to answer it after the fact. Sampling stays at 1.0 because a
# once-a-minute cron produces ~1,440 events/day, far too few for sampling to
# save anything worth the blind spots it would create.
[observability]
enabled = true
head_sampling_rate = 1.0

# D-12/D-13/D-09: the Worker's live algorithm state + per-event cron
# bookkeeping (algorithm_state, event_cursor — apps/worker/migrations/
# 0001_algorithm_state.sql). Batched reads/writes only (stateStore.ts) —
# never one query per team.
[[d1_databases]]
binding = "DB"
database_name = "sigmascout-state"
database_id = "8c1cee63-0567-4faa-ad74-a7721728a956"

# D-01/D-02/D-16: published page artifacts (event/team/teams-list/
# events-list/compare JSON), written by the offline `pnpm publish:artifacts`
# CLI (plan 04-01) and read back by the client's serving layer. Same bucket
# ("sigmascout-artifacts") plan 04-01's tracer already published a real
# artifact to.
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "sigmascout-artifacts"

# NO [[kv_namespaces]] (quick task 260923-3w4). D-18 bound a `MANIFEST` KV
# namespace here as the "small, hot live-windows manifest pointer" — read at the
# top of every tick, written rarely by the offline publish step. Nothing in this
# repository ever wrote a value to it, so every tick paid a guaranteed KV miss
# and then the R2 read `liveWindows.ts` treated as a fallback. The namespace
# itself (id f051554d9d60407097959b92aca51109) still exists in the account and is
# simply no longer bound; deleting it there is a dashboard action, not a config
# one. The Worker now touches exactly two stores: D1 above and R2 above.
