<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>SigmaScout</title>
  <!--
    Colors are literal copies of theme.css's ribbon background token
    (#14532d, the tile) and ribbon accent token (#81c784, the sigma stroke),
    the same pairing Ribbon.tsx uses for the wordmark's Sigma on the dark bar.
    Drift between this file and theme.css is caught by src/favicon.test.ts.
  -->
  <rect width="32" height="32" fill="#14532d" />
  <path
    d="M25 7 H8.5 L16.5 16 L8.5 25 H25"
    fill="none"
    stroke="#81c784"
    stroke-width="3.4"
    stroke-linecap="butt"
    stroke-linejoin="miter"
  />
</svg>
