<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SigmaScout — Rarity tiers</title>
<link rel="stylesheet" href="../themes/default.css" />
<style>
  * { box-sizing:border-box; }
  body { margin:0; padding-top:52px; font-family:var(--font-sans); background:var(--color-bg); color:var(--color-text); -webkit-font-smoothing:antialiased; }
  #variant-nav { position:fixed; top:0; left:0; right:0; z-index:9998; background:#fff; border-bottom:1px solid var(--color-border);
    padding:8px 12px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:13px; }
  .variant-tab { border:1px solid var(--color-border); background:#fff; color:var(--color-text); padding:6px 12px; border-radius:var(--radius); cursor:pointer; font:inherit; }
  .variant-tab.active { background:var(--color-text); color:#fff; border-color:var(--color-text); }
  #variant-nav .spacer { flex:1; }
  #variant-nav .note { color:var(--color-text-muted); font-size:12px; }
  .variant { display:none; } .variant.active { display:block; }
  .page { max-width:1200px; margin:0 auto; padding:0 var(--space-md) var(--space-lg); }
  .tablewrap { overflow-x:auto; }
  .caption { max-width:1200px; margin:var(--space-md) auto 0; padding:0 var(--space-md); color:var(--color-text-muted); font-size:13px; line-height:1.65; }
  .caption b { color:var(--color-text); }
  table { width:100%; border-collapse:separate; border-spacing:0; font-size:var(--text-body); }
  th { text-align:left; font-size:var(--text-label); font-weight:600; color:var(--color-text-muted); padding:8px 10px; border-bottom:1px solid var(--color-border); white-space:nowrap; }
  th.num, td.num { text-align:right; font-variant-numeric:tabular-nums; }
  td { padding:7px 10px; border-bottom:1px solid var(--color-border); white-space:nowrap; }
  .team-no { font-variant-numeric:tabular-nums; font-weight:600; }
  .spread { font-size:var(--text-label); opacity:.72; }
  .muted { color:var(--color-text-muted); }
  .box { display:inline-block; padding:3px 8px; border-radius:5px; font-variant-numeric:tabular-nums; min-width:80px; text-align:right; }
  .pill { display:inline-block; padding:3px 9px; border-radius:99px; font-variant-numeric:tabular-nums; min-width:80px; text-align:right; color:#fff; font-weight:600; }
  .key { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; margin:0 0 14px; }
  .key .k { padding:3px 10px; border-radius:5px; font-size:12px; font-weight:600; }
  .slice { margin-bottom:26px; }
  .slice h2 { font-size:14px; font-weight:600; margin:0 0 2px; }
  .slice p.sub { margin:0 0 8px; font-size:12px; color:var(--color-text-muted); }
  .warn { border:1px solid #FCD34D; background:#FFFBEB; color:#78350F; border-radius:8px; padding:10px 12px; font-size:12.5px; line-height:1.6; margin:0 0 14px; }
</style>
</head>
<body>

<div id="variant-nav">
  <button class="variant-tab active" onclick="show('a', this)">A: Tinted boxes (all four tiers)</button>
  <button class="variant-tab" onclick="show('b', this)">B: Tinted boxes (Common = no box) &#9733; Selected</button>
  <button class="variant-tab" onclick="show('c', this)">C: Solid rarity pills</button>
  <span class="spacer"></span>
  <span class="note">Percentiles against all 3,709 teams &middot; not the visible rows</span>
</div>

<div id="wrap"></div>

<script src="data.js"></script>
<script>
/*
 * Rarity tiers, per the user's spec: Common 0-50, Rare 50-75, Epic 75-95, Legendary 95-100.
 * Discrete bands rather than a continuous ramp — the point is that a tier has a NAME you can
 * say out loud ("that's a gold team"), which a gradient never gives you.
 *
 * The hues are NOT the classic card-game set. Classic rarity blue (#3B82F6) against purple
 * (#9333EA) measures dE 1.3 under deuteranopia — the two middle tiers are literally the same
 * colour to ~6% of males. Pushing blue toward CYAN fixes it: #0EA5E9 vs #9333EA measures
 * dE 14.1 deutan / 22.7 tritan / 26.5 normal, passing every validator check. Same vocabulary,
 * actually readable. Tinted boxes clear WCAG AA (4.51-6.92:1); solid pills use darker fills so
 * white text clears AA too (4.76-6.98:1).
 *
 * Percentiles are computed against DIST — the whole 3,709-team field — NOT against the visible
 * rows. That distinction is the entire point of the three slices below.
 */
var TIERS = [
  { name:'Common',    pct:'0–50',   bg:'#F1F5F9', fg:'#475569', solid:'#64748B' },
  { name:'Rare',      pct:'50–75',  bg:'#E0F2FE', fg:'#0369A1', solid:'#0369A1' },
  { name:'Epic',      pct:'75–95',  bg:'#F3E8FF', fg:'#7E22CE', solid:'#7E22CE' },
  { name:'Legendary', pct:'95–100', bg:'#FEF3C7', fg:'#B45309', solid:'#B45309' }
];
function tierFor(p) { return p >= 95 ? 3 : p >= 75 ? 2 : p >= 50 ? 1 : 0; }
var fmt = function (n) { return n.toFixed(2); };

/* Percentile against the FULL field. */
function pctOf(v, col) {
  var a = DIST[col], lo = 0, hi = a.length;
  while (lo < hi) { var m = (lo + hi) >> 1; if (a[m] < v) lo = m + 1; else hi = m; }
  return (lo / (a.length - 1)) * 100;
}

function keyRow(mode) {
  return '<div class="key"><span class="muted" style="font-weight:600">Key (percentile)</span>' +
    TIERS.map(function (t, i) {
      if (mode === 'nogrey' && i === 0) return '<span class="k" style="border:1px dashed var(--color-border);color:var(--color-text-muted)">' + t.pct + ' · no box</span>';
      if (mode === 'solid') return '<span class="k" style="background:' + t.solid + ';color:#fff">' + t.pct + '</span>';
      return '<span class="k" style="background:' + t.bg + ';color:' + t.fg + '">' + t.pct + '</span>';
    }).join('') +
    '<span class="muted" style="font-size:12px">' + TIERS.map(function (t) { return t.name; }).join(' · ') + '</span></div>';
}
function cell(v, spread, col, mode) {
  var t = TIERS[tierFor(pctOf(v, col))];
  var inner = fmt(v) + '<span class="spread"> ± ' + fmt(spread) + '</span>';
  if (mode === 'solid') return '<td class="num"><span class="pill" style="background:' + t.solid + '">' + inner + '</span></td>';
  if (mode === 'nogrey' && t === TIERS[0]) return '<td class="num"><span class="box">' + inner + '</span></td>';
  return '<td class="num"><span class="box" style="background:' + t.bg + ';color:' + t.fg + '">' + inner + '</span></td>';
}
function tableFor(rows, mode) {
  return '<div class="tablewrap"><table><thead><tr><th class="num">Rank</th><th class="num">Team #</th><th>Nickname</th>' +
    '<th class="num">Total</th><th class="num">Hub Auto</th><th class="num">Hub Endgame</th><th class="num">Record</th></tr></thead><tbody>' +
    rows.map(function (t) {
      return '<tr><td class="num muted">' + t.rank + '</td><td class="num team-no">' + t.n + '</td><td>' + t.nick + '</td>' +
        cell(t.total, t.spread, 'total', mode) + cell(t.hubAuto, t.hubAutoS, 'hubAuto', mode) +
        cell(t.hubEndgame, t.hubEndgameS, 'hubEndgame', mode) +
        '<td class="num muted">' + t.w + '-' + t.l + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

var SLICE_META = [
  ['top',   'Teams page, sorted by Total — ranks 1–10',
            'What a visitor sees first. Every one of these is p99.6+, so every box is Legendary.'],
  ['mid',   'Teams page, scrolled deep — ranks 1,201–1,210',
            'Adjacent rows in the middle of the field. The tiers separate here.'],
  ['event', 'An event-shaped set — 10 teams spread across the field',
            'Ranks 4 / 181 / 521 / 901 / 1,501 / 2,101 / 2,601 / 3,101 / 3,401 / 3,651. Closest to an Event page or a comparison, where a real range of teams sits together.']
];

function build(id, mode, caption) {
  return '<div id="v-' + id + '" class="variant">' +
    '<header style="background:var(--color-chrome);padding:12px 16px;">' +
      '<div style="max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap;">' +
        '<span style="font-size:var(--text-display);font-weight:600;letter-spacing:-.02em;">SigmaScout</span>' +
        '<nav style="display:flex;gap:16px;font-size:14px;font-weight:600;">' +
          '<span style="border-bottom:2px solid #7E22CE;color:#7E22CE;padding-bottom:2px;">Teams</span>' +
          '<span class="muted">Events</span><span class="muted">Compare</span></nav>' +
        '<span style="flex:1"></span><span style="font-size:13px" class="muted">2026 · Sigma1 2.0.0</span>' +
      '</div></header>' +
    '<div class="page" style="padding-top:16px;">' +
      '<h1 style="font-size:var(--text-heading);font-weight:600;margin:0 0 2px;">Teams — 2026</h1>' +
      '<p class="muted" style="margin:0 0 12px;font-size:13px;">3,709 teams · band cuts on Total: p50 = 39.2 · p75 = 74.4 · p95 = 167.8</p>' +
      keyRow(mode) +
      '<div class="warn"><b>Read the three slices together.</b> Percentiles here are against the whole 3,709-team ' +
        'field, which is how it would really work — so the top of the sorted table is uniformly Legendary and the ' +
        'tiers convey nothing there. They earn their place on mixed sets. This is the honest version; scoring the ' +
        'idea on a top-10 sample alone would have flattered it.</div>' +
      SLICE_META.map(function (s) {
        return '<div class="slice"><h2>' + s[1] + '</h2><p class="sub">' + s[2] + '</p>' + tableFor(SLICES[s[0]], mode) + '</div>';
      }).join('') +
    '</div><p class="caption">' + caption + '</p></div>';
}

document.getElementById('wrap').innerHTML =
  build('a', 'all', '<b>Every tier gets a box — your spec exactly.</b> Common reads as a real tier rather than an absence, so the banding is explicit and the key is complete. Cost: about half of all teams carry a box meaning "unremarkable", and in the event-shaped slice that is a lot of grey doing no work.') +
  build('b', 'nogrey', '<b>Common gets no box.</b> Same bands, but the bottom half renders plain — mirroring your Statbotics reference, whose 25–75 band is white. Colour appears only where it means something, so the eye goes straight to Rare and above. Trade: Common stops being nameable, and a team just under p50 looks untreated rather than Common.') +
  build('c', 'solid', '<b>Solid pills — the strongest card-game read.</b> Tiers are unmistakable and it feels closest to the rarity idea. On a dense table it is a lot of saturated colour, and it will compete with alliance red/blue on match pages. Fills darkened so white text clears WCAG AA.');
document.getElementById('v-a').classList.add('active');

function show(id, el) {
  document.querySelectorAll('.variant').forEach(function (v) { v.classList.remove('active'); });
  document.querySelectorAll('.variant-tab').forEach(function (t) { t.classList.remove('active'); });
  document.getElementById('v-' + id).classList.add('active');
  el.classList.add('active');
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
